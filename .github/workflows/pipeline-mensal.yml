# Execução recorrente (Fase 10 — Automação).
#
# AGENDAMENTO DESATIVADO ATÉ A PRIMEIRA CARGA REAL VALIDAR O PIPELINE.
# Motivos: (1) o runner do GitHub não guarda o Bronze entre execuções, então
# cada mês rebaixaria duas competências inteiras (dezenas de GB) com disco e
# tempo limitados; (2) sem --competencia/--anterior o pipeline cairia nos
# defaults fixos do run_pipeline.py. Reative o `schedule` quando a ingestão
# descobrir sozinha a competência mais recente e a anterior.
name: Pipeline mensal

on:
  # schedule:
  #   - cron: '0 9 5 * *'      # dia 5 de cada mês, 09:00 UTC
  workflow_dispatch:
    inputs:
      competencia:
        description: 'Competência atual AAAA-MM'
        required: true
      anterior:
        description: 'Competência anterior AAAA-MM'
        required: true

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[ia]"
      - name: Rodar pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_pipeline.py --uf MG \
            --competencia "${{ inputs.competencia }}" \
            --anterior "${{ inputs.anterior }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-mensal
          path: data/digests/*.md
